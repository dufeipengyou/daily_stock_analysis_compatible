name: Daily Stock Dual-Engine Analysis

on:
  schedule:
    - cron: '0 0 * * 1-5'  # 工作日北京时间 08:00 (UTC 00:00) 自动运行
  workflow_dispatch:

jobs:
  rule_monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pandas numpy requests openpyxl xlrd yfinance akshare

      - name: Run Rule-Based Monitor
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python main.py
